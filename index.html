<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Scan2Order</title>

        <style>
            * {
                  box-sizing: border-box;
                        margin: 0;
                              padding: 0;
                                    font-family: Arial, sans-serif;
                                        }

                                            body {
                                                  background: #f5f5f5;
                                                        color: #222;
                                                            }

                                                                .header {
                                                                      background: #111;
                                                                            color: white;
                                                                                  padding: 25px 20px;
                                                                                        text-align: center;
                                                                                            }

                                                                                                .header h1 {
                                                                                                      font-size: 28px;
                                                                                                            margin-bottom: 6px;
                                                                                                                }

                                                                                                                    .header p {
                                                                                                                          color: #ccc;
                                                                                                                                font-size: 14px;
                                                                                                                                    }

                                                                                                                                        .container {
                                                                                                                                              max-width: 600px;
                                                                                                                                                    margin: auto;
                                                                                                                                                          padding: 20px;
                                                                                                                                                              }

                                                                                                                                                                  .restaurant {
                                                                                                                                                                        background: white;
                                                                                                                                                                              padding: 18px;
                                                                                                                                                                                    border-radius: 15px;
                                                                                                                                                                                          margin-bottom: 20px;
                                                                                                                                                                                                box-shadow: 0 4px 15px rgba(0,0,0,0.08);
                                                                                                                                                                                                    }

                                                                                                                                                                                                        .restaurant h2 {
                                                                                                                                                                                                              margin-bottom: 5px;
                                                                                                                                                                                                                  }

                                                                                                                                                                                                                      .restaurant p {
                                                                                                                                                                                                                            color: #777;
                                                                                                                                                                                                                                  font-size: 14px;
                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                          .item {
                                                                                                                                                                                                                                                background: white;
                                                                                                                                                                                                                                                      padding: 16px;
                                                                                                                                                                                                                                                            margin-bottom: 12px;
                                                                                                                                                                                                                                                                  border-radius: 14px;
                                                                                                                                                                                                                                                                        display: flex;
                                                                                                                                                                                                                                                                              justify-content: space-between;
                                                                                                                                                                                                                                                                                    align-items: center;
                                                                                                                                                                                                                                                                                          box-shadow: 0 3px 12px rgba(0,0,0,0.06);
                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                  .item h3 {
                                                                                                                                                                                                                                                                                                        margin-bottom: 5px;
                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                .price {
                                                                                                                                                                                                                                                                                                                      color: #e85d04;
                                                                                                                                                                                                                                                                                                                            font-weight: bold;
                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                    button {
                                                                                                                                                                                                                                                                                                                                          background: #111;
                                                                                                                                                                                                                                                                                                                                                color: white;
                                                                                                                                                                                                                                                                                                                                                      border: none;
                                                                                                                                                                                                                                                                                                                                                            padding: 10px 15px;
                                                                                                                                                                                                                                                                                                                                                                  border-radius: 9px;
                                                                                                                                                                                                                                                                                                                                                                        cursor: pointer;
                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                .cart {
                                                                                                                                                                                                                                                                                                                                                                                      margin-top: 25px;
                                                                                                                                                                                                                                                                                                                                                                                            background: white;
                                                                                                                                                                                                                                                                                                                                                                                                  padding: 20px;
                                                                                                                                                                                                                                                                                                                                                                                                        border-radius: 15px;
                                                                                                                                                                                                                                                                                                                                                                                                              box-shadow: 0 4px 15px rgba(0,0,0,0.08);
                                                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                                                      .cart h2 {
                                                                                                                                                                                                                                                                                                                                                                                                                            margin-bottom: 10px;
                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                    #total {
                                                                                                                                                                                                                                                                                                                                                                                                                                          font-size: 20px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                font-weight: bold;
                                                                                                                                                                                                                                                                                                                                                                                                                                                      margin: 15px 0;
                                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                                              .order-btn {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    width: 100%;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          padding: 14px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                font-size: 16px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      background: #e85d04;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </head>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <body>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="header">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <h1>Scan2Order</h1>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <p>Scan • Select • Order</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <div class="container">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="restaurant">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <h2>🍽️ Aman Restaurant</h2>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <p>Table No. 7 • Welcome!</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div class="item">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <h3>🍔 Burger</h3>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <p class="price">₹120</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button onclick="addItem('Burger', 120)">Add</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="item">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <h3>🍕 Pizza</h3>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <p class="price">₹250</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <button onclick="addItem('Pizza', 250)">Add</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div class="item">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <h3>🥤 Cold Drink</h3>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <p class="price">₹60</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button onclick="addItem('Cold Drink', 60)">Add</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="cart">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <h2>🛒 Your Order</h2>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div id="cartItems">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    No items added yet.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div id="total">Total: ₹0</div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <button class="order-btn" onclick="placeOrder()">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              Place Order
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                let cart = [];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let total = 0;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        function addItem(name, price) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              cart.push({ name, price });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    total += price;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          document.getElementById("cartItems").innerHTML =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  cart.map(item => `<p>${item.name} - ₹${item.price}</p>`).join("");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById("total").innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                "Total: ₹" + total;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        function placeOrder() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if (cart.length === 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      alert("Please add an item first!");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          alert("Order placed successfully! 🎉");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </script>
<script type="module">
  // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
  // TODO: Add SDKs for Firebase products that you want to use
  // https://firebase.google.com/docs/web/setup#available-libraries

  // Your web app's Firebase configuration
  const firebaseConfig = {

    authDomain: "scan2order-1e5fb.firebaseapp.com",
    projectId: "scan2order-1e5fb",
    storageBucket: "scan2order-1e5fb.firebasestorage.app",
    messagingSenderId: "854560018689",
    appId: "1:854560018689:web:99a08f349ab0da74bdcb00"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
</script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </html>
